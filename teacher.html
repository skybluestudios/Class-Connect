<main id=mn class=hide>
<section id=vd><div class=tiles id=tl></div>
<div class=two><div class=c><h3>Class controls</h3><div id=cb></div></div><div class=c><h3>Activity</h3><div class=fd id=fd></div></div></div>
<div class=c><h3>Focus score by student</h3><div id=lb></div></div></section>
<section id=vs class=hide><div class=c id=lt></div><div class=c><div class=row><input class=in id=q placeholder="🔍 Search students" oninput="q=this.value.toLowerCase();draw()" style="flex:1;min-width:180px"><span id=fc class=row></span><button class="sm g" onclick=tickAll()>Select all</button><button class="sm r" id=rs onclick="removeStudents([...ticks])">Remove selected (0)</button></div><small class=mu>Click a screen to expand it in high resolution. Previews stay low-bandwidth.</small></div><div class=grid id=rt></div></section>

<div class=row id=qc style="margin-bottom:10px"></div>
<textarea class=in id=mt rows=3 style="width:100%;resize:vertical" placeholder="Type your message… (⌘/Ctrl + Enter sends to the class)" onkeydown="(event.metaKey||event.ctrlKey)&&event.key=='Enter'&&msg(0)"></textarea>
<div class=row style="margin-top:10px"><button onclick="msg(0)">Send to whole class</button><button class=g onclick="msg(1)">Send to selected students</button></div></div></section>
</main>

function login(){const v=$('cd').value.trim();if(!/^\d{6}$/.test(v)){err='Enter 6 digits';return ui()}code=v;err='';ui();if(ac&&ac.open)ac.send({t:'auth',code,pid});else{last=0;tick()}}
function tick(){if(!code||!pid||(ac&&ac.open)||Date.now()-last<3500)return;last=Date.now();try{ac&&ac.close()}catch(e){}

 else if(d.t=='policy'){pol=d;enforce();if(PR.st&&pol.canPresent===false)stopPresent();if(Rec.on&&!canRec())recStop();ui();stuAll({t:'policy',cap:pol.cap});classes.forEach(k=>{stuAll({t:'pip',on:pipEff(k)},k.id);stuAll({t:'cam',m:camM(k),face:!!pol.face},k.id)})}
 else if(d.t=='kick'){setPause('paused');authed=false;code='';err='Access removed by admin';pol={hidden:[]};ui()}

function ui(){const w=!authed||pol.paused||!code;if(w){XP.close();stopPresent()}$('ov').classList.toggle('hide',!w);$('mn').classList.toggle('hide',w);$('hn').classList.toggle('hide',w);
 $('lg').classList.toggle('hide',!!code);$('err').textContent=err;$('who').textContent=authed?tname:'';

 if(!w){drawBar();setView(view)}}

function addC(){if(pol.canCreate===false)return toast('Class creation is turned off by the admin');if(pol.maxClasses&&classes.length>=pol.maxClasses)return toast('Class limit reached ('+pol.maxClasses+')');

 set($('cb'),c?`<div class=mu>Class code</div><div class=code>${c.code}</div><div style="margin:8px 0">${sw('Class open',c.active,"tog('active')")}${sw('Auto-find',c.auto,"tog('auto')")}<br>${sw('Focus monitoring'+L('focus'),c.focus,"tog('focus')",LK('focus'))}${sw('👀 Eyes up on the board'+L('eyes'),c.eyes,"tog('eyes')",pol.eyes===false||LK('eyes'))}<br>${sw('🖥️ Require full-screen sharing'+L('share'),needSh(c),"tog('share')",LK('share'))}${sw('📌 Floating display (PiP)'+(pol.pipAllow?L('pip'):' — not enabled by admin'),pipEff(c),"tog('pip')",!pol.pipAllow||LK('pip'))}${sw('Alert pop-ups &amp; sound',alertsOn,"tog('alerts')")}</div>

peer.on('connection',c=>{let s;c.on('data',d=>{

  for(const cid in known)if(cid!=k.id&&known[cid][d.sid])delete known[cid][d.sid];
  const m=STU[k.id]=STU[k.id]||{};s=m[d.sid]=Object.assign(m[d.sid]||{left:0,on:0,tot:0},{name:String(d.name).slice(0,40),c,st:'ok',ts:Date.now(),k:k.id,asl:0,pid:d.pid,q:'off',sh:false,cm:false});
  (known[k.id]=known[k.id]||{})[d.sid]=s.name;sv();c.send({t:'yes',cname:k.name,focus:!!k.focus,eyes:!!k.eyes,share:needSh(k),pip:pipEff(k),cap:pol.cap,cam:camM(k),face:!!pol.face,rec:Rec.on&&Rec.cid==k.id?recK():null});c.send({t:'watch',q:'off'});ev(k,s.name,'joined','pg')}
 else if(s&&d.t=='hb'){const w=s.st,ws=s.sh,k=classes.find(x=>x.id==s.k);s.st=d.st;s.sh=!!d.sh;const wf=s.fa;s.cm=!!d.cm;s.fa=!!d.fa;if(k&&d.fa&&!wf)ev(k,s.name,'is not visible to the camera','pr',1);else if(k&&!d.fa&&wf)ev(k,s.name,'is visible to the camera again','pg');s.ts=Date.now();
  if(k&&d.st=='away'&&w!='away'){s.left++;ev(k,s.name,'left the page','pr',1)}else if(k&&d.st=='ok'&&w=='away')ev(k,s.name,'is back on the page','pg');
  if(k&&needSh(k)&&ws&&!s.sh)ev(k,s.name,'stopped sharing their screen','pr',1);else if(k&&!ws&&s.sh)ev(k,s.name,'is sharing their screen','pg')}
 else if(s&&d.t=='woke'){s.note='Woke from sleep '+new Date().toLocaleTimeString()}});

function stuAll(m,cid){for(const id in STU)if(!cid||id==cid)for(const s in STU[id])if(STU[id][s].c&&STU[id][s].c.open)STU[id][s].c.send(m)}
function status(k,s){if(!s||!s.c||!s.c.open)return['Not connected','pa'];if(needSh(k)&&!s.sh)return['Not sharing screen','pr'];if(s.fa)return['📷 Not visible to camera','pr'];if(!k.focus)return[s.sh?'Sharing screen':'Connected','pg'];

 const rc=Rec.on&&cid==Rec.cid&&!hid(s.name)&&authed&&!pol.paused&&canRec(),w=(k&&cid==k.id&&view=='s'&&!hid(s.name)&&!document.hidden&&authed&&!pol.paused&&pol.canView!==false)?(XP.id==sid?'high':rc?'mid':'low'):rc?'mid':'off';if(s.q!==w){s.q=w;s.c.send({t:'q',q:w})}}}

 if(asl&&!s.asl){s.asl=1;ev(k,s.name,'laptop went to sleep or went offline','pr',1)}else if(!asl&&s.asl){s.asl=0;ev(k,s.name,'is back online','pg')}}});if(authed&&Date.now()-lastAdm>7000)gone();wd();feedP();if(Rec.on)Rec.sync(Object.entries(STU[Rec.cid]||{}).filter(([i,s])=>!hid(s.name)).map(([i,s])=>({id:i,name:s.name,scr:s.vs,cam:s.vc})));applyQ();draw()},1000);
setInterval(()=>{if(authed&&ac&&ac.open)classes.filter(k=>k.active).forEach(k=>ac.send({t:'roster',cid:k.id,students:list(k).map(x=>({id:x.id,name:x.name,st:status(k,x.s)[0],pid:x.s&&x.s.c&&x.s.c.open?x.s.pid:null,sh:!!(x.s&&x.s.c&&x.s.sh),cm:!!(x.s&&x.s.c&&x.s.cm),pct:x.s&&x.s.tot>3?Math.round(x.s.on*100/x.s.tot):null,left:x.s?x.s.left:0}))}))},2000);
// ---- present my screen (window / tab / entire screen) to the whole class or to selected students
var PR={st:null,mode:'all',cid:null,ids:[],calls:new Map(),sent:{}};
async function present(mode){const k=cl();if(!k)return;if(pol.canPresent===false)return toast('Screen sharing to students is turned off by the admin');if(mode=='sel'&&!ticks.size)return toast('Select students first (tick them below)');
 stopPresent();try{const st=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:24,max:30},width:{max:1920},height:{max:1080}},audio:true,selfBrowserSurface:'exclude',surfaceSwitching:'include'});
  st.getVideoTracks()[0].onended=()=>{if(PR.st===st)stopPresent()};PR.sent={};PR.st=st;PR.mode=mode;PR.cid=k.id;PR.ids=mode=='sel'?[...ticks]:[];feedP();draw()}catch(e){toast('Sharing was cancelled')}}
function stopPresent(){const st=PR.st;PR.st=null;if(st)st.getTracks().forEach(t=>{try{t.stop()}catch(e){}});PR.calls.forEach(o=>{try{o.call.close()}catch(e){}});PR.calls.clear();if(st){stuAll({t:'present',on:0});draw()}}
function feedP(){if(!PR.st)return;const m=STU[PR.cid]||{},n=Date.now();for(const i in m){const s=m[i],want=PR.mode=='all'||PR.ids.includes(i),o=PR.calls.get(s.pid);
  if(!want||!s.c||!s.c.open||!s.pid||!authed||pol.paused){if(o){try{o.call.close()}catch(e){}PR.calls.delete(s.pid)}continue}
  if(o&&o.call.open)continue;if(n-(PR.sent[s.pid]||0)>3000){PR.sent[s.pid]=n;s.c.send({t:'present',on:1,from:tname||'Your teacher'})}}}
// ---- recording
function recStart(){const k=cl();if(!k||Rec.on)return;if(!canRec())return toast('Recording is not enabled by the admin');Rec.start(k.id,k.name,recKinds());stuAll({t:'rec',on:1,k:recK()},k.id);applyQ();draw()}
async function recStop(){const k=classes.find(c=>c.id==Rec.cid);await Rec.stop();if(k)stuAll({t:'rec',on:0},k.id);applyQ();draw()}
function recClear(){if(!Rec.on&&confirm('Discard all recorded footage in this browser?')){Rec.F=[];draw()}}
function liveHtml(k){const n=list(k).filter(x=>x.s&&x.s.c&&x.s.cm).length;
 return `<div class=row style="gap:8px 14px"><b>🖥️ Share my screen</b>${PR.st?`<span class="pill pg">Sharing to ${PR.mode=='all'?'the whole class':PR.ids.length+' selected'} · ${PR.calls.size} connected</span><button class="sm r" onclick=stopPresent()>⏹ Stop sharing</button>`:pol.canPresent===false?'<span class=mu>Turned off by the admin</span>':`<button class=sm onclick="present('all')">Whole class</button><button class="sm g" onclick="present('sel')">Selected students (${ticks.size})</button><small class=mu>You can pick a window, a browser tab, or your entire screen</small>`}</div>
 <div class=row style="gap:4px 14px;margin-top:10px"><b>📷 Webcams</b>${!pol.camAllow?'<span class=mu>Not enabled by the admin</span>':canCamCtl()?sw('On for this class',!!k.cam,"tog('cam')")+`<span class="pill pn">${pol.camMode=='req'?'Required for students':'Optional for students'}</span>`+(k.cam?`<span class=mu>${n} streaming</span>`:''):`<span class=mu>Only the admin can switch webcams on or off${k.cam?' · currently ON ('+n+' streaming)':''}</span>`}</div>
 <div class=row style="gap:4px 14px;margin-top:10px"><b>📌 Floating display</b>${pol.pipAllow?sw('Open on student laptops',pipEff(k),"tog('pip')",LK('pip'))+'<small class=mu>Opens after a student’s first click on their page</small>':'<span class=mu>Not enabled by the admin</span>'}</div>
 <div class=row style="gap:4px 14px;margin-top:10px"><b>⏺ Recording</b>${canRec()?Rec.html():'<span class=mu>Not enabled for teachers by the admin</span>'}</div>`}
ui();
